<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>Welcome Home ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    overscroll-behavior:none;
}

body{

    width:100vw;
    height:100dvh;

    overflow:hidden;
    position:fixed;
    inset:0;

    font-family:sans-serif;

    background:#000 url("5ED5E28B-C2A7-4BB1-8322-678904E31F2D.jpeg") center center no-repeat;
    background-size:cover;

    touch-action:manipulation;

    padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
}

/* Bouquet */

#bouquet{

    position:absolute;
    bottom:45px;
    right:35px;

    font-size:75px;

    cursor:pointer;
    user-select:none;

    animation:float 2s ease-in-out infinite;

}

#bouquet:active{
    transform:none;
}

@keyframes float{

0%,100%{
transform:translateY(0);
}

50%{
transform:translateY(-10px);
}

}

/* Hearts */

.heart{

position:absolute;

pointer-events:none;

animation:rise 4s linear forwards;

}

@keyframes rise{

0%{

transform:
translateY(0)
scale(.5)
rotate(0deg);

opacity:1;

}

100%{

transform:
translateY(-900px)
translateX(var(--drift))
scale(1.5)
rotate(360deg);

opacity:0;

}

}

</style>
</head>

<body>

<audio id="music" preload="auto">
    <source src="Favorite Girl.mp3" type="audio/mpeg">
</audio>

<div id="bouquet">💐</div>

<script>

const bouquet = document.getElementById("bouquet");
const music = document.getElementById("music");

let started = false;

bouquet.addEventListener("click",()=>{

    if(!started){

        started = true;

        // Song starts at 1:39
        music.currentTime = 99;

        music.play();

    }

    for(let i=0;i<35;i++){

        setTimeout(createHeart,i*60);

    }

    bouquet.animate([
        {transform:"scale(1)"},
        {transform:"scale(1.15)"},
        {transform:"scale(1)"}
    ],{
        duration:400
    });

});

function createHeart(){

    const heart = document.createElement("div");

    heart.className = "heart";

    heart.innerHTML = ["💗","💕","💖","💘"][Math.floor(Math.random()*4)];

    heart.style.left = (window.innerWidth-120+Math.random()*80)+"px";

    heart.style.bottom = "80px";

    heart.style.fontSize = (22+Math.random()*24)+"px";

    heart.style.setProperty("--drift",(Math.random()*220-110)+"px");

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },4000);

}

// Prevent scrolling/bounce on iPhone
document.addEventListener("touchmove", function(e){
    e.preventDefault();
}, { passive:false });

document.addEventListener("gesturestart", function(e){
    e.preventDefault();
});

document.addEventListener("gesturechange", function(e){
    e.preventDefault();
});

document.addEventListener("gestureend", function(e){
    e.preventDefault();
});

</script>

</body>
</html>
