<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Welcome Home ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
font-family:sans-serif;
}

body{

background:url("5ED5E28B-C2A7-4BB1-8322-678904E31F2D.jpeg") center center/cover no-repeat fixed;

}

/* Bouquet */

#bouquet{

position:absolute;
bottom:45px;
right:35px;

font-size:75px;
cursor:pointer;
user-select:none;
transition:.25s;

animation:float 2s ease-in-out infinite;

}

#bouquet:active{

transform:scale(.9);

}

@keyframes float{

0%,100%{
transform:translateY(0px);
}

50%{
transform:translateY(-10px);
}

}

/* Floating Hearts */

.heart{

position:absolute;

font-size:28px;

animation:rise 4s linear forwards;

pointer-events:none;

}

@keyframes rise{

0%{

transform:
translateY(0px)
scale(.5)
rotate(0deg);

opacity:1;

}

100%{

transform:
translateY(-900px)
translateX(var(--drift))
scale(1.5)
rotate(360deg);

opacity:0;

}

}

</style>
</head>
<body>

<audio id="music" preload="auto">
<source src="Favorite Girl.mp3" type="audio/mpeg">
</audio>

<div id="bouquet">
💐
</div>

<script>

const bouquet=document.getElementById("bouquet");
const music=document.getElementById("music");

let started=false;

bouquet.addEventListener("click",()=>{

if(!started){

started=true;

/* CHANGE THIS NUMBER */
music.currentTime = 99;

/* Example:
0 = beginning
15 = 15 seconds
63 = 1:03
94 = 1:34
*/

music.play();

}

for(let i=0;i<30;i++){

setTimeout(createHeart,i*70);

}

bouquet.animate([

{transform:"scale(1)"},

{transform:"scale(1.2)"},

{transform:"scale(1)"}

],{

duration:500

});

});

function createHeart(){

const heart=document.createElement("div");

heart.className="heart";

heart.innerHTML=["💗","💕","💖","💘"][Math.floor(Math.random()*4)];

heart.style.left=(window.innerWidth-120+Math.random()*80)+"px";

heart.style.bottom="80px";

heart.style.setProperty("--drift",(Math.random()*240-120)+"px");

heart.style.fontSize=(22+Math.random()*26)+"px";

document.body.appendChild(heart);

setTimeout(()=>{

heart.remove();

},4000);

}

</script>

</body>
</html>
