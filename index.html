<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For My Girl ❤️</title>
        <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f2e9;
        }

        /* Background setup using viet.jpg */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('viet.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
        }

        /* Container positioned perfectly over the blank ticket */
        .ticket-content {
            position: absolute;
            top: 28.5%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50%;
            max-width: 220px;
            text-align: center;
            z-index: 2;
        }

        .countdown-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #555;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .timer {
            font-size: 16px;
            font-weight: bold;
            color: #222;
            line-height: 1.3;
        }

        .interactive-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        z-index: 3;
                pointer-events: none;
        }

        .heart-btn {
            position: relative;
            top: 130px;
            width: 65px;
            height: 65px;
            background: #d94556;
            transform: rotate(-45deg);
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            animation: pulse 1.4s infinite;
            cursor: pointer;
            pointer-events: auto;
            border: none;
            outline: none;
        }
    
        .heart-btn:before,
        .heart-btn:after {
            content: "";
            width: 65px;
            height: 65px;
            background: #d94556;
            border-radius: 50%;
            position: absolute;
        }

        .heart-btn:before {
            top: -32.5px;
            left: 0;
        }
    
        .heart-btn:after {
            top: 0;
            left: 32.5px;
        }
    
        @keyframes pulse {
            0% { transform: scale(0.95) rotate(-45deg); }
            70% { transform: scale(1.1) rotate(-45deg); }
            100% { transform: scale(0.95) rotate(-45deg); }
        }
    
        .floating-heart {
            position: absolute;
            color: #d94556;
            font-size: 24px;
            pointer-events: none;
            z-index: 4;
            animation: floatUp 2.5s linear forwards;
        }
    
        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1.5) rotate(360deg);
                opacity: 0;
            }
        }
        </style>
</head>
<body>

    <div class="background"></div>

    <div class="ticket-content">
        <div class="countdown-title">Counting down to June 30th</div>
        <div class="timer" id="countdown">Loading...</div>
    </div>

    <div class="interactive-layer" id="layer">
        <button class="heart-btn" id="playTrigger" aria-label="Play Music"></button>
    </div>

    <audio id="bgMusic" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <script>
        // 1. Countdown Logic targeting June 30th, 2026
        const targetDate = new Date("June 30, 2026 00:00:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference < 0) {
                document.getElementById("countdown").innerHTML = "The day is here! ❤️";
                return;
            }

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById("countdown").innerHTML = 
                `${days}d ${hours}h<br>${minutes}m ${seconds}s`;
        }
        
        setInterval(updateCountdown, 1000);
        updateCountdown();

        // 2. Audio Control & Visual Effects
        const music = document.getElementById("bgMusic");
        const trigger = document.getElementById("playTrigger");
        const layer = document.getElementById("layer");

        trigger.addEventListener("click", () => {
            // Safely plays music. If already playing, it will keep playing uninterrupted
            if (music.paused) {
                music.play().catch(err => console.log("Audio playback interaction requirement restriction applied:", err));
            }

            // Burst a cluster of cute hearts when she taps it
            for (let i = 0; i < 8; i++) {
                createHeart();
            }
        });

        function createHeart() {
            const heart = document.createElement("div");
            heart.classList.add("floating-heart");
            heart.innerHTML = "❤️";
            
            // Randomizes starting position across width of screen and slightly randomizes speeds
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = (Math.random() * 1.5 + 1.5) + "s";
            
            layer.appendChild(heart);

            // Cleans up memory by removing the element after animation ends
            setTimeout(() => {
                heart.remove();
            }, 3000);
        }
    </script>
</body>
</html>
