<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title> PARA EL AMOR DE MI VIDA 💖</title>

<style>
body {
    margin: 0;
    font-family: 'Comic Sans MS', cursive;
    color: white;
    text-align: center;
    background: url("Hearts2.jpg") no-repeat center center fixed;
    background-size: cover;
}

/* 💫 Smooth entrance */
.overlay {
    background: rgba(0,0,0,0.5);
    min-height: 100vh;
    padding: 20px;

    opacity: 0;
    animation: fadeIn 2s ease forwards;
}

@keyframes fadeIn {
    to { opacity: 1; }
}
/* 📱 Mobile optimization */
@media (max-width: 768px) {

    h1 {
        font-size: 4.5em;
    }

    body {
        font-size: 1.2em;
    }

    .btn {
        font-size: 1.3em;
        padding: 16px 24px;
    }

    .photobooth img {
        width: 320px;
    }

    .note {
        font-size: 1.2em;
        padding: 25px;
    }
}
h1 {
    font-size: 3em;
    margin-top: 20px;
}

.pink { color: #ff69b4; text-shadow: 0 0 10px #ff69b4; }
.blue { color: #4da6ff; text-shadow: 0 0 10px #4da6ff; }

/* Photo */
.photobooth img {
    width: 250px;
    border-radius: 20px;
    border: 4px solid white;
    box-shadow: 0 0 20px rgba(255,255,255,0.6);
}

/* Buttons */
.letters {
    margin-top: 40px;
}

.btn {
    background: linear-gradient(45deg, #ff69b4, #4da6ff);
    border: none;
    padding: 12px 20px;
    margin: 10px;
    border-radius: 20px;
    color: white;
    font-size: 1em;
    cursor: pointer;
    transition: 0.3s;
}

.btn:hover {
    transform: scale(1.1);
}

.btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

/* Notes */
.note {
    display: none;
    margin-top: 20px;
    background: rgba(255,255,255,0.2);
    padding: 20px;
    border-radius: 20px;
    backdrop-filter: blur(10px);
    max-width: 400px;
    margin-left: auto;
    margin-right: auto;
}
</style>
</head>

<body>

<!-- 🎶 Music -->
<audio id="bgMusic">
    <source src="oursong.mp3" type="audio/mpeg">
</audio>

<div class="overlay">

<h1><span class="pink">I LOVE YOU!</span></h1>

<!-- PHOTO -->
<div class="photobooth">
    <img src="us.HEIC" alt="us 💕">
</div>

<!-- BUTTONS -->
<div class="letters">

    <!-- FIRST BUTTON ALWAYS ACTIVE -->
    <button id="btn1" class="btn" onclick="showNote(1); playMusicOnce()">
        Open Letter 💌
    </button>

    <!-- LOCKED UNTIL BTN1 -->
    <button id="btn2" class="btn" onclick="showNote(2)" disabled>
        Another One 👀
    </button>

    <!-- LOCKED UNTIL BTN2 -->
    <button id="btn3" class="btn" onclick="showNote(3)" disabled>
        Last One 💖
    </button>

</div>

<!-- NOTES -->
<div id="note1" class="note">
    You’re my Angel fr 💖  
    I don’t even know how I got this lucky, but I’m so appreciative of you
</div>

<div id="note2" class="note">
    Every picture we take, every moment we have  
    it just keeps getting better with you ❤️
</div>

<div id="note3" class="note">
    <p>Hint: our first child 👀</p>

    <input type="text" id="password" placeholder="Enter password...">
    <br><br>
    <button class="btn" onclick="checkPassword()">Unlock 💖</button>

    <div id="finalMessage" style="display:none; margin-top:15px;">
        It’s always gonna be me and you.  
        I'm deeply in love with you 💗
    </div>
</div>

</div>

<script>
let musicStarted = false;

/* 🎶 Play music only once */
function playMusicOnce() {
    if (!musicStarted) {
        document.getElementById("bgMusic").play();
        musicStarted = true;
    }
}

/* 💌 Main note system + unlocking */
function showNote(num) {
    let notes = document.querySelectorAll('.note');
    notes.forEach(n => n.style.display = 'none');

    document.getElementById('note' + num).style.display = 'block';

    // 🔓 Unlock progression
    if (num === 1) {
        document.getElementById("btn2").disabled = false;
    }

    if (num === 2) {
        document.getElementById("btn3").disabled = false;
    }
}

/* 🔐 Password check */
function checkPassword() {
    let input = document.getElementById("password").value.toLowerCase();

    if (input === "max") {
        document.getElementById("finalMessage").style.display = "block";
    } else {
        alert("Wrong password 😭 try again");
    }
}
</script>

</body>
</html>
