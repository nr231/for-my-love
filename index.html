<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title> PARA EL AMOR DE MI VIDA 💖</title>

<style>
body {
    margin: 0;
    font-family: 'Comic Sans MS', cursive;
    color: white;
    text-align: center;

    /* YOUR BACKGROUND */
    background: url("hearts.jpg") no-repeat center center fixed;
    background-size: cover;
}

/* Dark overlay so text is readable */
.overlay {
    background: rgba(0,0,0,0.5);
    min-height: 100vh;
    padding: 20px;
}

h1 {
    font-size: 3em;
    margin-top: 20px;
}

.pink { color: #ff69b4; text-shadow: 0 0 10px #ff69b4; }
.blue { color: #4da6ff; text-shadow: 0 0 10px #4da6ff; }

/* Photo Booth Strip */
.photobooth {
    margin-top: 30px;
}

.photobooth img {
    width: 250px;
    border-radius: 20px;
    border: 4px solid white;
    box-shadow: 0 0 20px rgba(255,255,255,0.6);
}

/* Love Letter Buttons */
.letters {
    margin-top: 40px;
}

.btn {
    background: linear-gradient(45deg, #ff69b4, #4da6ff);
    border: none;
    padding: 12px 20px;
    margin: 10px;
    border-radius: 20px;
    color: white;
    font-size: 1em;
    cursor: pointer;
    transition: 0.3s;
}

.btn:hover {
    transform: scale(1.1);
}

/* Hidden Love Notes */
.note {
    display: none;
    margin-top: 20px;
    background: rgba(255,255,255,0.2);
    padding: 20px;
    border-radius: 20px;
    backdrop-filter: blur(10px);
    max-width: 400px;
    margin-left: auto;
    margin-right: auto;
}

</style>
</head>

<body>

<div class="overlay">

<h1>
    <span class="pink">I LOVE YOU!</span>
</h1>


<!-- PHOTO BOOTH -->
<div class="photobooth">
    <img src="us.HEIC" alt="us 💕">
</div>

<!-- LOVE LETTER BUTTONS -->
<div class="letters">
    <button class="btn" onclick="showNote(1)">Open Letter 💌</button>
    <button class="btn" onclick="showNote(2)">Another One 👀</button>
    <button class="btn" onclick="showNote(3)">Last One 💖</button>
</div>

<!-- LOVE NOTES -->
<div id="note1" class="note">
    You’re my Angel fr 💖  
    I don’t even know how I got this lucky, but I’m so appreciative of you
</div>

<div id="note2" class="note">
    Every picture we take, every moment we have  
    it just keeps getting better with you❤️
</div>

<!-- LOCKED LOVE NOTE -->
<div id="note3" class="note">
    <p>Hint: our first child 👀</p>

    <input type="text" id="password" placeholder="Enter password...">
    <br><br>
    <button class="btn" onclick="checkPassword()">Unlock 💖</button>

    <div id="finalMessage" style="display:none; margin-top:15px;">
        It’s always gonna be me and you.  
        I'm deeply in love with you💗
    </div>
</div>


<script>
function showNote(num) {
    let notes = document.querySelectorAll('.note');
    notes.forEach(n => n.style.display = 'none');

    document.getElementById('note' + num).style.display = 'block';
}
</script>

<script>
function showNote(num) {
    let notes = document.querySelectorAll('.note');
    notes.forEach(n => n.style.display = 'none');

    document.getElementById('note' + num).style.display = 'block';
}

// PASSWORD CHECK
function checkPassword() {
    let input = document.getElementById("password").value.toLowerCase();

    if (input === "max") {
        document.getElementById("finalMessage").style.display = "block";
    } else {
        alert("Wrong password 😭 try again");
    }
}
</script>

</body>
</html>
